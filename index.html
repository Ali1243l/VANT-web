<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VANT Lookbook</title>
    <meta name="description" content="Bilingual luxury fashion lookbook with dynamic masonry grid, interactive drawer sheet, and size matrix." />
    <meta property="og:title" content="VANT Lookbook" />
    <meta property="og:description" content="Bilingual luxury fashion lookbook with dynamic masonry grid, interactive drawer sheet, and size matrix." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f8f9fa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem('vant-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#0d0f12] text-[#15171c] dark:text-[#f3f4f6] antialiased selection:bg-[#004ad7]/20 selection:text-[#004ad7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
