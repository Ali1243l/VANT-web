<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VANT | Editorial Streetwear Catalogue</title>
    <meta
      name="description"
      content="Editorial luxury streetwear and haute-couture catalogue by Maison VANT. Curated handcrafted pieces, dynamic sizing, and bespoke tailoring."
    />
    <!-- Open Graph / WhatsApp / Instagram / Facebook Link Previews -->
    <meta property="og:site_name" content="Maison VANT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VANT | Editorial Streetwear Catalogue" />
    <meta
      property="og:description"
      content="Editorial luxury streetwear and haute-couture catalogue by Maison VANT. Curated handcrafted pieces, dynamic sizing, and bespoke tailoring."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80"
    />
    <meta property="og:image:secure_url" content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="1067" />
    <meta property="og:image:alt" content="Maison VANT | Editorial Streetwear Catalogue" />
    <meta property="og:locale" content="ar_IQ" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VANT | Editorial Streetwear Catalogue" />
    <meta
      name="twitter:description"
      content="Editorial luxury streetwear and haute-couture catalogue by Maison VANT. Curated handcrafted pieces, dynamic sizing, and bespoke tailoring."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80"
    />
    <meta name="twitter:image:alt" content="Maison VANT | Editorial Streetwear Catalogue" />

    <meta name="theme-color" content="#f8f9fa" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Maison VANT",
        "alternateName": "ڤانت",
        "description": "Editorial luxury streetwear and haute-couture catalogue by Maison VANT.",
        "image": "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80",
        "currenciesAccepted": "IQD",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IQ"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem('vant-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#0d0f12] text-[#15171c] dark:text-[#f3f4f6] antialiased selection:bg-[#004ad7]/20 selection:text-[#004ad7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
